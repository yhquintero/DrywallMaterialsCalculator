name: Server CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Consola de licencias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22]

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test suite
        run: npm test

      - name: Smoke test de endpoints públicos
        run: |
          printf '%s\n' \
            'NODE_ENV=test' \
            'PORT=8443' \
            'ENABLE_HTTPS=false' \
            'JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef' \
            'MASTER_KEY=ci-master-key-0123456789abcdef' \
            'RSA_KEY_SIZE=2048' \
            'DB_FILE=:memory:' > .env
          node --no-warnings src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://127.0.0.1:8443/api/public/health > /dev/null 2>&1; then break; fi
          done
          curl -fsS http://127.0.0.1:8443/api/public/health
          echo
          curl -fsS "http://127.0.0.1:8443/.well-known/licensing-public-key.json" | head -c 200
          echo
          curl -fsS "http://127.0.0.1:8443/.well-known/licensing-public-key-v2.pem" | head -1
          curl -fsS "http://127.0.0.1:8443/.well-known/licensing-public-key-v2.pem?app=keygen_pro" | head -1
          curl -fsS "http://127.0.0.1:8443/.well-known/apps.json" > /dev/null
          curl -fsS "http://127.0.0.1:8443/api/public/rates" > /dev/null
          curl -fsS "http://127.0.0.1:8443/api/public/revocation-status?signature=c2lnLWRlLXBydWViYQ==" > /dev/null
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/api/licenses)
          if [ "$STATUS" != "401" ]; then
            echo "ESPERADO 401 en /api/licenses sin token, obtenido $STATUS"
            kill $SERVER_PID
            exit 1
          fi
          kill $SERVER_PID
