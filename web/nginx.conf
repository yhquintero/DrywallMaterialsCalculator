# ─────────────────────────────────────────────────────────────────────────────
#  DrywallPro Master — nginx de producción (HTTPS obligatorio)
#
#  Sirve el build estático de web/dist y hace proxy inverso de la API de la
#  Consola de Licencias (server/) por el MISMO origen. Al ir todo bajo un único
#  dominio HTTPS no hay CORS ni contenido mixto.
#
#  Despliegue:  docker compose up -d   (ver deploy/docker-compose.yml)
#  Certificados: Let's Encrypt con certbot, o monta los tuyos en /etc/ssl.
# ─────────────────────────────────────────────────────────────────────────────

# Limita la tasa de peticiones a los endpoints de credenciales (anti fuerza bruta).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP → HTTPS: ninguna petición se atiende en claro.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Excepción mínima para la validación ACME de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── Certificados SSL / TLS ────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/drywallpro.crt;
    ssl_certificate_key /etc/ssl/private/drywallpro.key;
    ssl_trusted_certificate /etc/ssl/certs/chain.pem;

    # Solo TLS 1.2 y 1.3, con PFS y AEAD.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_ecdh_curve X25519:secp384r1;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Encabezados de seguridad estrictos ────────────────────────────
    # HSTS: un año, subdominios y precarga (solo emitir sobre TLS real).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), xr-spatial-tracking=(self), fullscreen=(self), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # ── Bloqueo de patrones maliciosos a nivel de borde ───────────────
    if ($query_string ~* "union.*select|waitfor.*delay|drop.*table|xp_cmdshell|<script|select.*from|insert.*into") {
        return 403;
    }

    # Oculta la versión y corta cuerpos gigantes.
    server_tokens off;
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;

    # ── API de la Consola de Licencias (mismo origen ⇒ sin CORS) ──────
    # Endpoints de credenciales con límite estricto.
    location ~ ^/api/auth/(login|refresh|logout)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://console-api:8443;
        include /etc/nginx/proxy_params_console;
    }

    # Endpoints públicos que consumen las apps Android.
    location ~ ^/(api/public/|\.well-known/) {
        proxy_pass http://console-api:8443;
        include /etc/nginx/proxy_params_console;
        proxy_cache_valid 200 60s;
    }

    # Resto de la API (requiere JWT).
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://console-api:8443;
        include /etc/nginx/proxy_params_console;
    }

    # ── SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # index.html sin caché (para que los despliegues se vean al instante).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Estáticos con huella digital: caché inmutable de un año.
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Nunca exponer la BD, los certificados ni los .env.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|sqlite|sqlite3|env|pem|key)$ { deny all; }
}
