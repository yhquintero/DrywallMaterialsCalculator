# nginx interno del contenedor web (deploy/Dockerfile.web).
# NO termina TLS: Caddy lo hace delante y reenvía X-Forwarded-Proto=https.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de seguridad ────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # HSTS lo emite Caddy (que es quien ve el TLS); aquí solo si llega cifrado.
    map $http_x_forwarded_proto $hsts_header {
        https   "max-age=31536000; includeSubDomains; preload";
        default "";
    }
    add_header Strict-Transport-Security $hsts_header always;

    # ── Bloqueo de patrones maliciosos ────────────────────────────────
    if ($query_string ~* "union.*select|waitfor.*delay|drop.*table|xp_cmdshell|<script|select.*from|insert.*into") {
        return 403;
    }

    # ── API de la consola (mismo origen ⇒ sin CORS ni mixed content) ──
    location /api/ {
        proxy_pass http://console-api:8443;
        include /etc/nginx/proxy_params_console;
    }

    location /.well-known/ {
        proxy_pass http://console-api:8443;
        include /etc/nginx/proxy_params_console;
    }

    # ── SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|sqlite|sqlite3|env|pem|key)$ { deny all; }
}
