# ─────────────────────────────────────────────────────────────────────────────
#  Despliegue completo en HTTPS con TLS automático (Let's Encrypt vía Caddy)
#
#    caddy        → :443 público, certificados automáticos, HSTS, proxy inverso
#    console-web  → nginx con el build estático de web/dist
#    console-api  → Node (Express + SQLite) con la lógica de licencias y RBAC
#
#  Arranque:
#    npm run build
#    cd deploy && docker compose up -d --build
#
#  Variables obligatorias (crear deploy/.env a partir de deploy/.env.example):
#    DOMAIN, JWT_SECRET, MASTER_KEY, BOOTSTRAP_ADMIN_PASSWORD
# ─────────────────────────────────────────────────────────────────────────────

name: drywallpro-license-console

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [console-web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]

  console-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    depends_on: [console-api]
    networks: [frontend, backend]

  console-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    expose:
      - "8443"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8443"
      # TLS lo termina Caddy; el contenedor sirve HTTP interno.
      ENABLE_HTTPS: "false"
      TRUST_PROXY: "true"
      SECURE_COOKIES: "true"
      DB_FILE: /data/drywall_console.db
      WEB_DIST: /nonexistent
      PUBLIC_URL: https://${DOMAIN}
      PUBLIC_HOST: ${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      MASTER_KEY: ${MASTER_KEY:?Define MASTER_KEY en deploy/.env (NO lo cambies después)}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@drywallpro.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RSA_KEY_SIZE: ${RSA_KEY_SIZE:-4096}
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - console_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [backend]

volumes:
  caddy_data:
  caddy_config:
  console_data:

networks:
  frontend:
  backend:
    internal: false
